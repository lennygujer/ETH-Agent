[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-agent"
version = "0.1.0"
description = "ETH Study Agent – Prüfungsvorbereitung mit eigenem Kursmaterial"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6",
    "numpy>=1.26",
    # für Prüfcode (Sandbox)
    "sympy>=1.12",
    "scipy>=1.11",
    "pint>=0.23",
    # Server für Open WebUI
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Embeddings auf dem Server (CPU). Ohne dieses Extra läuft die Suche nur über Stichworte (BM25).
embed = ["sentence-transformers>=3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
eth-agent = "eth_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
