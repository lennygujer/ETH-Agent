# Kopieren nach config.yaml und Pfade anpassen.

# Wurzel des gespiegelten OneDrive-Ordners "ETH". Darunter <Semester>/<Fach>/ (HS26/Physik 2/…)
# oder direkt <Fach>/. Die Fächer werden automatisch erkannt (discover_courses).
material_root: ~/eth-agent/material
discover_courses: true

# Ordner/Dateien, die nie als Fach oder Material gelten (Muster wie in der Shell)
ignore: [".*", "__pycache__", "node_modules", "venv", ".venv", "Code-Demo-*"]

# Ohne /fach im Chat: über alle Fächer suchen (leer) oder ein festes Fach (Kurs-ID)
default_course:

# Einstellungen für alle automatisch erkannten Fächer
course_defaults:
  output_language: de
  # hints = bei Aufgaben zuerst Tipps, ganze Lösung nur mit --loesung (empfohlen); full = sofort ganze Lösung
  solution_mode: hints

# Eigene Kürzel zusätzlich zu den automatischen (/physik, /analysis3, /dm, …)
course_aliases:
  sst: "System und Signaltheorie"
  sigsys: "System und Signaltheorie"
  ec: "Electronic Circuits"
  info: "Informatik 2"

# Index, Manifest, Cache.
data_dir: ~/eth-agent/data

# Optional: Fächer mit eigenen Einstellungen. Alle anderen werden automatisch erkannt.
courses:
  # Schlüssel = Kurs-ID (kurz, ohne Leerzeichen); folder = Ordner unter material_root
  physik2:
    folder: "Physik 2"
    name: "Physik II (Quantenmechanik)"
    output_language: de
    # Hauptskript für Notation und Zitate
    notation_source: "Sheets/script_phys_II.pdf"
    solution_mode: hints

# Zuordnung Unterordner -> Dokumenttyp (Gross-/Kleinschreibung egal).
# Dateinamen mit "exam"/"pruefung"/"prüfung" werden immer als Prüfung erkannt,
# Dateinamen mit "formula"/"formel" als Formelsammlung, "script"/"skript" als Skript.
folder_doc_types:
  exercises: serie
  serien: serie
  exercise solutions: serie_loesung
  serien loesungen: serie_loesung
  exams: pruefung
  pruefungen: pruefung
  exam solutions: pruefung_loesung
  pruefungen loesungen: pruefung_loesung
  sheets: skript
  skripte: skript
  übungsstunden: uebungsstunde
  uebungsstunden: uebungsstunde
  notizen: notizen
  papers: paper

retrieval:
  chunk_tokens: 600        # Skript/Notizen: Zielgrösse pro Abschnitt
  overlap_tokens: 80
  top_k: 20                # Kandidaten vor Fusion/Rerank
  final_k: 5
  # Embeddings (nur mit `pip install .[embed]`). leer lassen = nur BM25.
  embedding_model: "BAAI/bge-m3"   # Fallback bei wenig RAM: "intfloat/multilingual-e5-small"
  semantic_weight: 0.7
  keyword_weight: 0.3

models:
  codex_model:                 # leer = Standardmodell von Codex
  # Denkaufwand von Codex: none | minimal | low | medium | high | xhigh
  # Mehr Aufwand = gründlicher, aber langsamer und mehr Verbrauch am Abo-Kontingent.
  codex_effort_hard: medium    # Aufgaben, Herleitungen, Code
  codex_effort_default: low    # Erklärungen und allgemeine Fragen
  claude_model:                # leer = Standardmodell von Claude Code
  learn_provider: codex        # /learn unterrichtet mit codex oder claude (das andere ist Rückfall)
  timeout_s: 600
